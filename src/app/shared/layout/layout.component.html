<!-- Header -->
<header class="header">
  <div class="header-content">
    <div class="logo">
      <h1>CV Creator</h1>
    </div>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Trang Chủ</a>
      <a routerLink="/about" routerLinkActive="active">Về Chúng Tôi</a>
      <a routerLink="/contact" routerLinkActive="active">Liên Hệ</a>
    </nav>
    <div class="auth-menu">
      <ng-container *ngIf="!currentUser">
        <a routerLink="/login" class="btn-link">Đăng Nhập</a>
        <a routerLink="/register" class="btn-link btn-primary">Đăng Ký</a>
      </ng-container>
      <ng-container *ngIf="currentUser">
        <button mat-button [matMenuTriggerFor]="userMenu">{{ currentUser.fullName }}</button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="goToDashboard()">Dashboard</button>
          <button mat-menu-item (click)="goToProfile()">Hồ Sơ</button>
          <button mat-menu-item (click)="logout()">Đăng Xuất</button>
        </mat-menu>
  
      </ng-container>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-content">
    <p>&copy; 2025 CV Creator. Tất cả các quyền được bảo lưu.</p>
  </div>
</footer>
