<div class="auth-container">
  <div class="auth-card">
    <h2>Đăng Nhập</h2>
    <form (ngSubmit)="onLogin()" [formGroup]="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          #emailInput
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Nhập email của bạn"
          class="form-control"
        />
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
          Email không hợp lệ
        </small>
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input 
          #passwordInput
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="Nhập mật khẩu"
          class="form-control"
        />
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
          Mật khẩu không được để trống
        </small>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Đăng Nhập</span>
        <span *ngIf="isLoading">Đang xử lý...</span>
      </button>
    </form>
    <p class="auth-link">
      Chưa có tài khoản? <a routerLink="/register">Đăng ký tại đây</a>
    </p>
  </div>
</div>
