<div class="cv-form-container">
    <mat-card class="form-card">
        <mat-card-header>
            <mat-card-title>
                {{ isEditMode ? 'Edit CV' : 'Create New CV' }}
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="cvForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>CV Title</mat-label>
                        <input matInput formControlName="title" placeholder="e.g., Software Engineer CV">
                        <mat-error *ngIf="title?.hasError('required')">
                            Title is required
                        </mat-error>
                        <mat-error *ngIf="title?.hasError('minlength')">
                            Title must be at least 3 characters
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Job Role/Position</mat-label>
                        <input matInput formControlName="role" placeholder="e.g., Senior Developer">
                        <mat-error *ngIf="role?.hasError('required')">
                            Role is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-group">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Status</mat-label>
                        <mat-select formControlName="status">
                            <mat-option *ngFor="let option of statusOptions" [value]="option.value">
                                {{ option.label }}
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="status?.hasError('required')">
                            Status is required
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-actions">
                    <button mat-raised-button color="primary" type="submit" [disabled]="isLoading" class="submit-btn">
                        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
                        {{ isEditMode ? 'Update CV' : 'Create CV' }}
                    </button>
                    <button mat-stroked-button type="button" (click)="onCancel()" [disabled]="isLoading"
                        class="cancel-btn">
                        Cancel
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
